name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check traceability
        run: python3 scripts/validate.py
      - name: Check the generated matrix is current
        run: |
          python3 scripts/validate.py --write
          git diff --exit-code docs/traceability.md \
            || (echo "docs/traceability.md is stale — run scripts/validate.py --write" && exit 1)
