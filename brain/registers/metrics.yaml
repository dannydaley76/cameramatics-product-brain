# Metric register.
# layer: outcome | behaviour | engagement | quality | counter
# Every requirement must link to at least one metric (enforced by scripts/validate.py).
# Every outcome/behaviour metric must have at least one counter metric watching it.

metrics:
  - id: M-01
    layer: outcome
    audience: fleet operator
    name: At-fault collisions per 100 vehicles per month
    definition: >
      Count of collisions recorded as at-fault by the customer, normalised per
      100 active vehicles per calendar month. Mileage-normalised where the fleet
      has reliable odometer data, vehicle-normalised where it does not.
    target: Direction of travel down; no numeric target until baseline is measured.
    horizon: 6-12 months
    source: Customer-reported incident data, reconciled monthly
    caveats: Low base rate; not readable at single-fleet level inside a quarter ([[R-06]]).
    counters: [M-11]

  - id: M-02
    layer: outcome
    audience: fleet operator
    name: Cost of at-fault claims per vehicle per year
    definition: Total at-fault claim cost including repair, third-party and downtime, per vehicle per year.
    target: Direction of travel down.
    horizon: 12 months
    source: Customer finance / insurer data, annual
    caveats: Depends on customer willingness to share; likely only available for reference accounts.
    counters: [M-12]
    note: >
      The counter matters more here than it looks. Claims cost falls if a fleet
      simply stops claiming, or if cost is pushed onto drivers through excess
      policies and disciplinary routes. M-12 - disputes and coached-cohort
      attrition - is the signal that a falling number was bought that way.

  - id: M-03
    layer: behaviour
    audience: fleet operator, and us
    name: Coached-driver repeat rate (28-day)
    definition: >
      For drivers who received a coaching action on behaviour X, the share whose
      event rate for behaviour X in the following 28 days is lower than their
      preceding 28-day rate.
    target: Baseline in first 8 weeks, then hold above baseline; this is the primary product metric.
    horizon: 4-12 weeks
    source: Platform event data joined to coaching records
    caveats: Regression to the mean will flatter this; needs an uncoached control cohort to be credible.
    counters: [M-11, M-12]

  - id: M-04
    layer: behaviour
    audience: fleet operator
    name: Share of drivers in the high-risk band
    definition: Percentage of active drivers whose rolling risk score places them in the top band, measured monthly.
    target: Distribution shifts down over two quarters.
    horizon: 3-6 months
    source: Platform scoring
    counters: [M-11]

  - id: M-05
    layer: engagement
    audience: us
    name: High-severity events triaged within 7 days
    definition: Share of events classified high severity that reach a terminal review state (coached or dismissed) within 7 days of availability.
    target: ">= 90%"
    horizon: From week 1
    source: Portal event state transitions

  - id: M-06
    layer: engagement
    audience: us
    name: Median manager time per reviewed event
    definition: Median elapsed time from opening an event to setting a terminal state, per reviewing user.
    target: >
      NONE. Deliberately no target - this is a diagnostic, never a goal.
      The earlier version of this register set 90 seconds, which was an error:
      the objective is fewer collisions, not a faster reviewer. A manager who
      clears a set quickly and changes nothing has used the product exactly as
      designed and got nothing from it. See A-03.
    horizon: From week 1
    source: Portal instrumentation
    caveats: >
      Falling time can mean efficiency or rubber-stamping, and the two are
      indistinguishable from this number alone - read only with M-09 and M-12.

  - id: M-07
    layer: engagement
    audience: us
    name: Weekly reviewing accounts
    definition: Share of live accounts with at least one review session in a given week.
    target: ">= 80% by week 4 of an account going live"
    horizon: From week 1
    source: Portal instrumentation
    note: This is the habit metric. It is the earliest honest signal that the capability will or will not work.

  - id: M-08
    layer: engagement
    audience: us
    name: Coaching actions per 100 high-severity events
    definition: Count of logged coaching actions per 100 high-severity events surfaced.
    target: Baseline first; a very low number means the queue is not trusted, a very high number means severity is under-filtering.
    horizon: From week 2
    source: Portal instrumentation

  - id: M-09
    layer: quality
    audience: us
    name: High-severity dismissal rate
    definition: >
      Reported as two numbers, always together, because ADR-0008 makes a bulk
      dismissal one judgement rather than N.
      Population for both numbers: events in the critical or high band - the
      top of the queue - within the reporting week. Events closed unreviewed in
      an earlier week are counted against that week, not this one.
      Per judgement - dismissal decisions as a share of all terminal decisions
      taken on that population, counting a bulk dismissal once.
      Per event - share of that population's resolved events that ended in a
      dismissed state, counting every event inside a bulk dismissal.
      Together they are the best available proxy for precision at the top of the
      queue. Neither is readable alone.
    target: "< 20% per judgement. Per event reported, not targeted."
    horizon: From week 1
    source: Portal review outcomes
    counters: [M-11, M-14]
    note: >
      Deliberately a workflow metric rather than a model metric. We do not have
      ground truth on the road; we have a manager's judgement, and that is the
      judgement adoption depends on ([[R-02]]).
      The two-number definition exists because one number was gameable by a
      mechanism we introduced ourselves. Under ADR-0008 a manager who dismisses
      40 of 45 high-band events in a single action records one dismissal against
      45 events - 2.2%, which reads as excellent precision at the exact moment
      the queue was rejected wholesale. The metric moved in the wrong direction
      as the behaviour it exists to detect got worse.
      The per-judgement number carries the pass/fail term. A bulk dismissal is
      one judgement, and counting it as N charges a grouping failure to the
      grading model - forty events from one trip reaching the queue separately
      is the grouping rule failing, not the grading rule. Targeting per event
      would also point the cheapest route to the target straight at grouping
      more aggressively, which is the behaviour ADR-0007 walked away from.
      The hole that leaves - a manager who sweeps every week keeps this number
      comfortable while rejecting almost everything - is closed by M-14, which
      is a term in the 90-day test in its own right. See judgement-log J-22.

  - id: M-10
    layer: quality
    audience: us
    name: Video availability
    definition: >
      Share of surfaced events with reviewable video, and median time from event
      detection to video being playable in the portal.
    target: ">= 98% availability; median < 15 minutes"
    horizon: From week 1
    source: Platform pipeline telemetry
    note: An event without footage is not coachable. This metric gates the whole loop.

  - id: M-11
    layer: counter
    audience: us
    name: Band distribution, and downgrade audit sample outcome
    definition: >
      Share of detected events routed to each severity band (critical, high,
      medium, low), plus the outcome of the periodic human-read downgrade audit sample
      of bulk dismissals and of the medium and low bands: how many should have
      graded higher.
    target: >
      Monitored, not optimised. The downgrade audit finding rate is the number that
      matters - a rising share of "should have been higher" invalidates the
      grading model regardless of what M-09 says.
    horizon: From week 1
    source: >
      Platform telemetry plus the downgrade audit sample. The audit runs from
      first release as a manual CameraMatics-side practice; the sampling and
      finding-recording surface is phase 2 ([[ADR-0013]]).
    note: >
      Reframed by ADR-0007. Nothing is suppressed - every event is retained,
      scored and contributes to the driver record, and the band decides only the
      action. So this counter measures grading quality rather than concealment,
      which is both more honest and more useful. The failure it guards against
      is an event that deserved a conversation being sent as a notification
      instead ([[R-12]]).

  - id: M-12
    layer: counter
    audience: fleet operator, and us
    name: Driver disputes and coached-cohort attrition
    definition: >
      Count of driver disputes raised per 100 coaching actions and the share
      upheld, plus voluntary attrition among coached drivers versus fleet average.
    target: Monitored. A rising upheld-dispute rate invalidates M-03.
    horizon: From month 2
    source: Coaching records; customer HR data where shared
    note: Proxy for the fairness constraint in [[personas/fleet-manager]] and [[jtbd]].

  - id: M-13
    layer: engagement
    audience: us
    name: Recognition actions, and the recognition-to-coaching ratio
    definition: >
      Count of confirmed recognition actions per 100 credit-classified events,
      and the ratio of recognition actions to coaching actions across the fleet.
    target: >
      No target on the raw count. The ratio is watched: a fleet where the product
      has spoken to drivers only to criticise, over a quarter, is failing canon
      C-30 whatever the coaching numbers say.
    horizon: From week 2
    source: Portal instrumentation
    counters: [M-12]
    note: >
      Introduced by ADR-0010. Deliberately not a target, because a recognition
      quota would produce exactly the unearned praise that R-13 warns about. It
      is a distribution to look at, not a number to hit.

  - id: M-14
    layer: counter
    audience: us
    name: Sweep share - high-severity events cleared by bulk action
    definition: >
      Share of high-severity events that left the review set through a bulk
      dismissal rather than through individual review, per account per week.
    target: >
      No account clearing more of its high-severity set by bulk action than by
      individual review. Baseline measured from week 1; no tighter threshold
      until there is evidence to set one with (canon C-03).
    horizon: From week 1
    source: Portal review outcomes
    note: >
      Exists because M-09 is targeted per judgement, which is right, and that
      leaves a hole. A manager who sweeps the whole set every week records one
      dismissal a week and keeps M-09 comfortable while rejecting almost
      everything we put in front of them. M-07 catches the disengagement that
      usually follows and M-11's audit samples sweeps for content, but neither
      was a term in the 90-day test. This is.
      The target is a comparison rather than a constant deliberately: if more of
      the high-severity set leaves by sweep than by anyone looking at it, the
      queue has been rejected, and that reading needs no invented threshold.


  - id: M-15
    layer: behaviour
    audience: fleet operator
    name: Risky-event rate per exposure
    definition: >
      Count of critical and high band events across the fleet, normalised per
      1,000 miles where odometer data is reliable and per 100 vehicle-days where
      it is not - the same denominator caveat M-01 carries.
    target: >
      Direction of travel down. Baseline over the first 4 weeks; no numeric
      target until there is a baseline to set one against.
    horizon: Readable from week 4
    source: Platform telemetry, plus the customer's mileage or vehicle-day data
    counters: [M-11]
    note: >
      The fastest honest signal that something is changing on the road.
      Collisions are too rare to read inside a quarter (M-01, R-06); the events
      this product already detects are not, and they are the nearest available
      measure of near misses.
      It is the only behaviour metric here that needs neither driver attribution
      (Q-09, R-09) nor an uncoached control cohort (Q-07), so it survives the two
      dependencies most likely to fail.
      What it cannot do: attribute a change to coaching. It measures the fleet,
      not the driver, and a fleet can improve because two drivers left. That is
      M-03's job and this does not replace it.
      Gamed by grading more conservatively, which is why it is read with M-11's
      band distribution and never on its own.

  - id: M-16
    layer: behaviour
    audience: fleet operator, and us
    name: Coaching coverage of the drivers generating the risk
    definition: >
      Of the drivers who generated a critical or high band event in a period,
      the share who had at least one coaching conversation or confirmed
      recognition in that period.
    target: >
      Baseline first. A low number sitting alongside healthy engagement numbers
      is the specific failure this exists to catch.
    horizon: From week 4
    source: Coaching and recognition records joined to event attribution
    counters: [M-12]
    note: >
      M-08 counts coaching actions per 100 high-severity events and cannot tell
      you whether the conversations reached the people the events came from. If
      A-20 holds and risk concentrates in a minority of drivers, coaching that
      lands on a different set of people leaves the fleet outcome flat while
      every engagement metric looks healthy.
      Depends on attribution (A-11, A-23) and degrades exactly where attribution
      does - overtime, agency drivers and swapped shifts, which R-09 notes are
      also the shifts where risk concentrates. Read the coverage number with the
      unattributed count beside it or it flatters itself.

  - id: M-17
    layer: counter
    audience: us
    name: At-fault collisions with a prior warning
    definition: >
      Of at-fault collisions in a period, the share where that driver had a
      critical or high band event in the preceding 28 days.
    target: >
      Monitored, never optimised, and deliberately no target. A target here
      would reward surfacing more events rather than the right ones.
    horizon: From month 3, and readable only in aggregate across accounts
    source: Customer-reported incident data (as M-01), joined to the event record
    note: >
      The only measure in this register that can say the queue is pointed at the
      wrong population. Every quality metric here is conditioned on the system
      having detected something: M-09 asks whether the manager agreed with what
      we showed them; M-11's audit catches events graded too low within the
      population we graded. Neither can see an event that never existed.
      If at-fault collisions routinely have no warning in front of them, triage
      is looking at the wrong things and a dismissal rate of 8% means nothing.
      This is the measurement of A-20 - the assumption risks-narrative names as
      the one no other metric would catch.
      Low counts make it slow and noisy at single-fleet level (R-06), so it is
      read across accounts and never quoted to one customer as evidence.
